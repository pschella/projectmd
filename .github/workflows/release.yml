name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p pmd-cli --target ${{ matrix.target }}
        working-directory: parser
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="pmd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "parser/target/${{ matrix.target }}/release/pmd" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="pmd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "parser/target/${{ matrix.target }}/release/pmd.exe" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          7z a "$name.zip" "$name"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
