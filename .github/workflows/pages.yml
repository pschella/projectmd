name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'viewer/**', 'examples/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/viewer _site/examples
          cp -r site/. _site/
          rm _site/build.py _site/page.template.html
          cp -r viewer/. _site/viewer/
          cp -r examples/. _site/examples/
          touch _site/.nojekyll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render docs
        run: |
          pip install markdown
          python3 site/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
