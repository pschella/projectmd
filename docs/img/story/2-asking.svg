<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 714' width='960' height='714' role='img' aria-label='Ingrid asks for commitments, by email'><style>@media (prefers-color-scheme:dark){[fill='#1f2937']{fill:#ececf8}[fill='#fbfaf7']{fill:#171728}[fill='#fff']{fill:#1f1f36}[fill='#6b7280']{fill:#a3a3c2}[fill='#4338ca']{fill:#a5b4fc}[fill='#16a34a']{fill:#86efac}[fill='#dc2626']{fill:#fca5a5}[fill='#d97706']{fill:#fcd34d}[fill='#fef3c7']{fill:#33290f}[fill='#eef2ff']{fill:#23234a}[fill='#f5f5f4']{fill:#222238}[fill='#f8fafc']{fill:#1b1b30}[fill='#e7e5e4']{fill:#2a2a44}[fill='#e0e7ff']{fill:#272750}[fill='#fafaf9']{fill:#1b1b30}[fill='#f0fdfa']{fill:#12302d}[fill='#dcfce7']{fill:#123020}[fill='#f0fdf4']{fill:#123020}[stroke='#1f2937']{stroke:#7c7ca3}[stroke='#d6d3cd']{stroke:#34344f}[stroke='#f1f5f9']{stroke:#2c2c46}[stroke='#f59e0b']{stroke:#a16207}[stroke='#a5b4fc']{stroke:#4f4f8a}[stroke='#16a34a']{stroke:#86efac}[stroke='#4338ca']{stroke:#a5b4fc}[stroke='#d97706']{stroke:#fcd34d}[stroke='#5eead4']{stroke:#2dd4bf}}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect x='1' y='1' width='958' height='712' rx='14' fill='#fbfaf7' stroke='#1f2937' stroke-width='2'/><circle cx='30' cy='30' r='15' fill='#4338ca'/><text x='30' y='35' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#fff' font-weight='700' text-anchor='middle' xml:space='preserve'>2</text><text x='54' y='27' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Tue 8 June</text><text x='54' y='45' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Ingrid asks for commitments, by email</text><g transform='translate(70,260) scale(1.0)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#4f46e5'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#f1d3b8'/><path d='M-20,-72 q0,-22 20,-22 q20,0 20,22 v14 h-8 v-12 h-24 v12 h-8 z' fill='#d9b26a'/><circle cx='0' cy='-72' r='17' fill='#f1d3b8'/><path d='M-17,-74 q1,-18 17,-18 q16,0 17,18 q-6,-4 -17,-9 q-9,6 -17,9 z' fill='#d9b26a'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/><g fill='none' stroke='#111827' stroke-width='1.4'><circle cx='-6' cy='-71' r='5'/><circle cx='6' cy='-71' r='5'/><path d='M-1,-71 h2'/></g></g><text x='70' y='276.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='600' text-anchor='middle' xml:space='preserve'>Ingrid</text><g><rect x='130' y='64' width='470' height='147' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='130' y='64' width='5' height='147' rx='2' fill='#4338ca'/><g transform='translate(144,73)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#4338ca' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#4338ca' stroke-width='1.5'/></g><text x='166' y='83' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Ingrid  →  Sam, Priya, Tomás</text><text x='588' y='83' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='end' xml:space='preserve'>Tue 8 June</text><text x='144' y='102' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Dates for scheduled deliveries</text><text x='144' y='122' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Hi all, we've committed to launching scheduled deliveries on 15</text><text x='144' y='139' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>September. To make that I need the slot API live by 2 Aug (Sam),</text><text x='144' y='156' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>the app release by 30 Aug (Priya) and support ready by 1 Sep</text><text x='144' y='173' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>(Tomás). Can each of you tell me what you can commit to? If a date</text><text x='144' y='190' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>doesn't work, I'd rather hear it now.</text></g><g><rect x='640' y='64' width='300' height='113' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='640' y='64' width='5' height='113' rx='2' fill='#0f766e'/><g transform='translate(654,73)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#0f766e' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#0f766e' stroke-width='1.5'/></g><text x='676' y='83' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Sam  →  Ingrid</text><text x='654' y='102' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Re: Dates</text><text x='654' y='122' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>2 Aug works, if the courier capacity feed</text><text x='654' y='139' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>is as simple as it looks. I'll tell you</text><text x='654' y='156' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>as soon as it isn't.</text></g><g><rect x='640' y='187' width='300' height='96' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='640' y='187' width='5' height='96' rx='2' fill='#c2410c'/><g transform='translate(654,196)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#c2410c' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#c2410c' stroke-width='1.5'/></g><text x='676' y='206' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Priya  →  Ingrid</text><text x='654' y='225' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Re: Dates</text><text x='654' y='245' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>30 Aug, but with no slack: we need Sam's</text><text x='654' y='262' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>API by 2 Aug to make it.</text></g><g><rect x='640' y='293' width='300' height='113' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='640' y='293' width='5' height='113' rx='2' fill='#0369a1'/><g transform='translate(654,302)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#0369a1' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#0369a1' stroke-width='1.5'/></g><text x='676' y='312' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Tomás  →  Ingrid</text><text x='654' y='331' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Re: Dates</text><text x='654' y='351' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>1 Sep. My agents will need final screens</text><text x='654' y='368' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>for the help articles; they'll ask Priya</text><text x='654' y='385' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>directly.</text></g><line x1='600' y1='120' x2='636' y2='120' stroke='#6b7280' stroke-width='2' marker-end='url(#ah)'/><text x='30' y='436' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Each owner writes their answer into their own plan. The shared check puts the two side by side:</text><rect x='24' y='454' width='912' height='230' rx='10' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><text x='40' y='474' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='700' text-anchor='start' xml:space='preserve'>ASKED, in Ingrid's plan</text><text x='420' y='474' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='700' text-anchor='start' xml:space='preserve'>PROMISED, in the owner's own plan</text><text x='808' y='474' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='700' text-anchor='start' xml:space='preserve'>STATUS</text><text x='40' y='504' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2937' font-weight='600' text-anchor='start' xml:space='preserve'>Slot API live</text><text x='40' y='521' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#4338ca' font-weight='700' text-anchor='start' xml:space='preserve'>by 2 August</text><text x='388' y='516' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='20' fill='#16a34a' font-weight='700' text-anchor='middle' xml:space='preserve'>=</text><text x='420' y='504' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Sam · his plan, backend repository</text><text x='420' y='521' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#4338ca' font-weight='700' text-anchor='start' xml:space='preserve'>2 August</text><rect x='808' y='499' width='72' height='24' rx='12' fill='#dcfce7' stroke='#16a34a'/><text x='844' y='516' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#16a34a' font-weight='700' text-anchor='middle' xml:space='preserve'>agreed</text><line x1='36' y1='530' x2='924' y2='530' stroke='#f1f5f9'/><text x='40' y='550' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2937' font-weight='600' text-anchor='start' xml:space='preserve'>App release</text><text x='40' y='567' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#4338ca' font-weight='700' text-anchor='start' xml:space='preserve'>by 30 August</text><text x='388' y='562' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='20' fill='#16a34a' font-weight='700' text-anchor='middle' xml:space='preserve'>=</text><text x='420' y='550' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Priya · her plan, from Jira</text><text x='420' y='567' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#4338ca' font-weight='700' text-anchor='start' xml:space='preserve'>30 August</text><rect x='808' y='545' width='72' height='24' rx='12' fill='#dcfce7' stroke='#16a34a'/><text x='844' y='562' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#16a34a' font-weight='700' text-anchor='middle' xml:space='preserve'>agreed</text><line x1='36' y1='576' x2='924' y2='576' stroke='#f1f5f9'/><text x='40' y='596' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2937' font-weight='600' text-anchor='start' xml:space='preserve'>Support ready</text><text x='40' y='613' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#4338ca' font-weight='700' text-anchor='start' xml:space='preserve'>by 1 September</text><text x='388' y='608' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='20' fill='#16a34a' font-weight='700' text-anchor='middle' xml:space='preserve'>=</text><text x='420' y='596' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Tomás · his plan, shared drive</text><text x='420' y='613' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#4338ca' font-weight='700' text-anchor='start' xml:space='preserve'>1 September</text><rect x='808' y='591' width='72' height='24' rx='12' fill='#dcfce7' stroke='#16a34a'/><text x='844' y='608' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#16a34a' font-weight='700' text-anchor='middle' xml:space='preserve'>agreed</text><text x='40' y='646' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>The other states:</text><text x='150' y='646' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>asked — no answer yet  ·  disputed — promised later than asked, so Ingrid must decide  ·  delivered — done</text><text x='40' y='672' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Asked and promised match, so each date is now a commitment, owned by the person who made it, in their own file.</text></svg>