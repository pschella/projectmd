d'/><text x='56' y='130' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Ingrid</text><text x='56' y='150' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>assistant + viewer</text><text x='56' y='168' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>chat agent edits</text><text x='56' y='182' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>launch.md; Gantt</text><rect x='193' y='112' width='138' height='84' rx='8' fill='#fff' stroke='#d6d3cd'/><text x='203' y='130' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Sam</text><text x='203' y='150' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>CI: pmd check</text><text x='203' y='168' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>on every pull request</text><rect x='340' y='112' width='138' height='84' rx='8' fill='#fff' stroke='#d6d3cd'/><text x='350' y='130' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Priya</text><text x='350' y='150' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>jira2pmd</text><text x='350' y='168' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>versions → mobile.md,</text><text x='350' y='182' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>DECIDE → Jira</text><rect x='487' y='112' width='138' height='84' rx='8' fill='#fff' stroke='#d6d3cd'/><text x='497' y='130' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Tomás</text><text x='497' y='150' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>board.html</text><text x='497' y='168' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>a one-file kanban over</text><text x='497' y='182' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>support.md</text><rect x='634' y='112' width='138' height='84' rx='8' fill='#fff' stroke='#d6d3cd'/><text x='644' y='130' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>agents</text><text x='644' y='150' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>the AGENTS.md loop</text><text x='644' y='168' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>pmd ready, edit, pmd</text><text x='644' y='182' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>check</text><rect x='781' y='112' width='138' height='84' rx='8' fill='#fff' stroke='#d6d3cd' stroke-dasharray='5 4'/><text x='791' y='130' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>anyone</text><text x='791' y='150' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>your idea here</text><text x='791' y='168' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>schedule --rows →</text><text x='791' y='182' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>spreadsheet</text><rect x='30' y='222' width='900' height='92' rx='10' fill='#eef2ff' stroke='#a5b4fc' stroke-width='1.5'/><text x='46' y='244' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>pmd: the reference tools</text><text x='46' y='262' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>One file plus its direct links per command. Views, never state.</text><rect x='46' y='276' width='104' height='26' rx='13' fill='#fff' stroke='#a5b4fc'/><text x='98.0' y='293' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#4338ca' font-weight='600' text-anchor='midd