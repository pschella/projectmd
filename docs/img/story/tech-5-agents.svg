e, and ask a human for a date</text><g transform='translate(70,300) scale(1.0)'><path d='M-28,0 v-26 q0,-20 28,-20 q28,0 28,20 v26 z' fill='#e5e7eb' stroke='#1f2937' stroke-width='2'/><rect x='-10' y='-30' width='20' height='12' rx='3' fill='#0d9488'/><path d='M0,-96 v-10' stroke='#1f2937' stroke-width='2'/><circle cx='0' cy='-108' r='4' fill='#0d9488'/><rect x='-20' y='-96' width='40' height='40' rx='10' fill='#f3f4f6' stroke='#1f2937' stroke-width='2'/><rect x='-14' y='-84' width='28' height='12' rx='6' fill='#111827'/><circle cx='-6' cy='-78' r='2.5' fill='#5eead4'/><circle cx='6' cy='-78' r='2.5' fill='#5eead4'/></g><text x='70' y='316' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#6b7280' font-weight='600' text-anchor='middle' xml:space='preserve'>writer-agent</text><g transform='translate(170,300) scale(1.0)'><path d='M-28,0 v-26 q0,-20 28,-20 q28,0 28,20 v26 z' fill='#e5e7eb' stroke='#1f2937' stroke-width='2'/><rect x='-10' y='-30' width='20' height='12' rx='3' fill='#0d9488'/><path d='M0,-96 v-10' stroke='#1f2937' stroke-width='2'/><circle cx='0' cy='-108' r='4' fill='#0d9488'/><rect x='-20' y='-96' width='40' height='40' rx='10' fill='#f3f4f6' stroke='#1f2937' stroke-width='2'/><rect x='-14' y='-84' width='28' height='12' rx='6' fill='#111827'/><circle cx='-6' cy='-78' r='2.5' fill='#5eead4'/><circle cx='6' cy='-78' r='2.5' fill='#5eead4'/></g><text x='170' y='316' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#6b7280' font-weight='600' text-anchor='middle' xml:space='preserve'>review-agent</text><g><rect x='230' y='64' width='330' height='156' rx='8' fill='#1e2433' stroke='#1f2937' stroke-width='1.8'/><path d='M230,86 v-14 a8,8 0 0 1 8,-8 h314 a8,8 0 0 1 8,8 v14 z' fill='#374151' stroke='#1f2937' stroke-width='1.8'/><circle cx='243' cy='75' r='3.6' fill='#f87171'/><circle cx='255' cy='75' r='3.6' fill='#fbbf24'/><circle cx='267' cy='75' r='3.6' fill='#34d399'/><text x='395.0' y='79' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#e5e7eb' font-weight='600' text-anchor='middle' xml:space='preserve'>writer-agent · after Priya's answer</text><text x='242' y='104' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#5eead4' font-weight='normal' text-anchor='start' xml:space='preserve'>$ pmd board help-centre.md</text><text x='242' y='120' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#e5e7eb' font-weight='normal' text-anchor='start' xml:space='preserve'>WAITING (4)</text><text x='242' y='136' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#fbbf24' font-weight='normal' text-anchor='start' xml:space='preserve'>  :12 Add screenshots  owner: writer-agent</text><text x='242' y='152' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#fbbf24' font-weight='normal' text-anchor='start' xml:space='preserve'>      waits on Draft six help articles,</text><text x='242' y='168' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#fbbf24' font-weight='normal' text-anchor='start' xml:space='preserve'>      Screens frozen for docs</text><text x='242' y='184' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#e5e7eb' font-weight='normal' text-anchor='start' xml:space='preserve'>  …</text><text x='242' y='200' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#e5e7eb' font-weight='normal' text-anchor='start' xml:space='preserve'>DOING (1)  :10 Draft six help articles</text></g><g><rect x='590' y='64' width='345' height='147' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='590' y='64' width='5' height='147' rx='2' fill='#0d9488'/><g transform='translate(604,73)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#0d9488' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#0d9488' stroke-width='1.5'/></g><text x='626' y='83' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>writer-agent (for Tomás)  →  Priya</text><text x='923' y='83' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='end' xml:space='preserve'>Thu 17 June</text><text x='604' y='102' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Final screens for the help articles</text><text x='604' y='122' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>I'm drafting the six help articles for Tomás.</text><text x='604' y='139' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Screenshots are the last input: to publish on</text><text x='604' y='156' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>13 August I need final screens by 19 July.</text><text x='604' y='173' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Could you commit to a date? I'll plan the</text><text x='604' y='190' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>screenshots around it.</text></g><g><rect x='590' y='221' width='345' height='96' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='590' y='221' width='5' height='96' rx='2' fill='#c2410c'/><g transform='translate(604,230)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#c2410c' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#c2410c' stroke-width='1.5'/></g><text x='626' y='240' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Priya  →  writer-agent</text><text x='604' y='259' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Re: Final screens</text><text x='604' y='279' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>16 July. We freeze the screens that day; after</text><text x='604' y='296' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>that only bug fixes.</text></g><line x1='560' y1='120' x2='586' y2='120' stroke='#6b7280' stroke-width='2' marker-end='url(#ah)'/><rect x='230' y='236' width='330' height='112' rx='8' fill='#fff' stroke='#d6d3cd'/><text x='244' y='258' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>AGENTS.md (next to help-centre.md)</text><text x='244' y='280' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>· Edit only help-centre.md. Owner: Tomás Reyes.</text><text x='244' y='297' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>· Ask for dates with by: on your own link line.</text><text x='244' y='314' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>· Never invent done: dates. Finish with pmd check.</text><text x='244' y='331' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>· Tomás approves tone and refund wording.</text><rect x='590' y='337' width='345' height='68.5' rx='6' fill='#fef3c7' stroke='#f59e0b'/><text x='600' y='357.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Agents own tasks. A person owns the promise: the</text><text x='600' y='375.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>help centre's 13 August date is Tomás's, and the</text><text x='600' y='392.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>approval waits on his to-do list, not theirs.</text></svg>