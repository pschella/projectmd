<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 576.5' width='960' height='576.5' role='img' aria-label='Ingrid lets her assistant keep the plan'><style>@media (prefers-color-scheme:dark){[fill='#1f2937']{fill:#ececf8}[fill='#fbfaf7']{fill:#171728}[fill='#fff']{fill:#1f1f36}[fill='#6b7280']{fill:#a3a3c2}[fill='#4338ca']{fill:#a5b4fc}[fill='#16a34a']{fill:#86efac}[fill='#dc2626']{fill:#fca5a5}[fill='#d97706']{fill:#fcd34d}[fill='#fef3c7']{fill:#33290f}[fill='#eef2ff']{fill:#23234a}[fill='#f5f5f4']{fill:#222238}[fill='#f8fafc']{fill:#1b1b30}[fill='#e7e5e4']{fill:#2a2a44}[fill='#e0e7ff']{fill:#272750}[fill='#fafaf9']{fill:#1b1b30}[fill='#f0fdfa']{fill:#12302d}[fill='#dcfce7']{fill:#123020}[fill='#f0fdf4']{fill:#123020}[stroke='#1f2937']{stroke:#7c7ca3}[stroke='#d6d3cd']{stroke:#34344f}[stroke='#f1f5f9']{stroke:#2c2c46}[stroke='#f59e0b']{stroke:#a16207}[stroke='#a5b4fc']{stroke:#4f4f8a}[stroke='#16a34a']{stroke:#86efac}[stroke='#4338ca']{stroke:#a5b4fc}[stroke='#d97706']{stroke:#fcd34d}[stroke='#5eead4']{stroke:#2dd4bf}}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect x='1' y='1' width='958' height='574.5' rx='14' fill='#fbfaf7' stroke='#1f2937' stroke-width='2'/><circle cx='30' cy='30' r='15' fill='#4338ca'/><text x='30' y='35' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#fff' font-weight='700' text-anchor='middle' xml:space='preserve'>9</text><text x='54' y='27' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Wed 7 July</text><text x='54' y='45' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Ingrid lets her assistant keep the plan</text><rect x='130' y='60' width='700' height='10' fill='none'/><rect x='300' y='66' width='520' height='67' rx='12' fill='#eef2ff' stroke='#a5b4fc' stroke-width='1.5'/><text x='312' y='88' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Sam split the API promise: booking API on 2 August, live courier capacity</text><text x='312' y='105' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>on 30 August. I told him I need capacity by 1 September for the go/no-go.</text><text x='312' y='122' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Update the launch plan.</text><g transform='translate(880,147) scale(0.5)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#4f46e5'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#f1d3b8'/><path d='M-20,-72 q0,-22 20,-22 q20,0 20,22 v14 h-8 v-12 h-24 v12 h-8 z' fill='#d9b26a'/><circle cx='0' cy='-72' r='17' fill='#f1d3b8'/><path d='M-17,-74 q1,-18 17,-18 q16,0 17,18 q-6,-4 -17,-9 q-9,6 -17,9 z' fill='#d9b26a'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/><g fill='none' stroke='#111827' stroke-width='1.4'><circle cx='-6' cy='-71' r='5'/><circle cx='6' cy='-71' r='5'/><path d='M-1,-71 h2'/></g></g><rect x='194' y='145' width='600' height='141' rx='12' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><text x='206' y='167' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Done, in your plan only. I renamed the API line to match Sam's new promise, asked for</text><text x='206' y='184' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>live capacity by 1 September, and made the go/no-go wait for it:</text><rect x='204' y='193' width='580' height='85' rx='5' fill='#f8fafc' stroke='#d6d3cd'/><text x='212' y='210' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.3' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>  - [ ] [Booking API ready][backend]  by: 2027-08-02  ^api</text><text x='212' y='225' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.3' fill='#16a34a' font-weight='normal' text-anchor='start' xml:space='preserve'>+ - [ ] [Live courier capacity][capacity]  by: 2027-09-01  ^capacity</text><text x='212' y='240' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.3' fill='#d97706' font-weight='normal' text-anchor='start' xml:space='preserve'>~ - [ ] Go/no-go  after: ^api  after: ^capacity  after: ^app  …</text><text x='212' y='255' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.3' fill='#16a34a' font-weight='normal' text-anchor='start' xml:space='preserve'>+ [capacity]: https://git.pantry.example/backend/backend.md#capacity-live</text><text x='212' y='270' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.3' fill='#4338ca' font-weight='normal' text-anchor='start' xml:space='preserve'>$ pmd check --deep launch.md   → clean, both lines agreed</text><g transform='translate(160,296) scale(0.5)'><path d='M-28,0 v-26 q0,-20 28,-20 q28,0 28,20 v26 z' fill='#e5e7eb' stroke='#1f2937' stroke-width='2'/><rect x='-10' y='-30' width='20' height='12' rx='3' fill='#0d9488'/><path d='M0,-96 v-10' stroke='#1f2937' stroke-width='2'/><circle cx='0' cy='-108' r='4' fill='#0d9488'/><rect x='-20' y='-96' width='40' height='40' rx='10' fill='#f3f4f6' stroke='#1f2937' stroke-width='2'/><rect x='-14' y='-84' width='28' height='12' rx='6' fill='#111827'/><circle cx='-6' cy='-78' r='2.5' fill='#5eead4'/><circle cx='6' cy='-78' r='2.5' fill='#5eead4'/></g><rect x='194' y='298' width='520' height='67' rx='12' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><text x='206' y='320' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Launch still has 14 days of slack. Worth watching: live capacity (30 Aug)</text><text x='206' y='337' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>and the app release (30 Aug) both land two days before the go/no-go. Shall</text><text x='206' y='354' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>I commit?</text><g transform='translate(160,375) scale(0.5)'><path d='M-28,0 v-26 q0,-20 28,-20 q28,0 28,20 v26 z' fill='#e5e7eb' stroke='#1f2937' stroke-width='2'/><rect x='-10' y='-30' width='20' height='12' rx='3' fill='#0d9488'/><path d='M0,-96 v-10' stroke='#1f2937' stroke-width='2'/><circle cx='0' cy='-108' r='4' fill='#0d9488'/><rect x='-20' y='-96' width='40' height='40' rx='10' fill='#f3f4f6' stroke='#1f2937' stroke-width='2'/><rect x='-14' y='-84' width='28' height='12' rx='6' fill='#111827'/><circle cx='-6' cy='-78' r='2.5' fill='#5eead4'/><circle cx='6' cy='-78' r='2.5' fill='#5eead4'/></g><rect x='300' y='377' width='520' height='33' rx='12' fill='#eef2ff' stroke='#a5b4fc' stroke-width='1.5'/><text x='312' y='399' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Yes. And every Monday morning, tell me what's on my list.</text><g transform='translate(880,424) scale(0.5)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#4f46e5'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#f1d3b8'/><path d='M-20,-72 q0,-22 20,-22 q20,0 20,22 v14 h-8 v-12 h-24 v12 h-8 z' fill='#d9b26a'/><circle cx='0' cy='-72' r='17' fill='#f1d3b8'/><path d='M-17,-74 q1,-18 17,-18 q16,0 17,18 q-6,-4 -17,-9 q-9,6 -17,9 z' fill='#d9b26a'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/><g fill='none' stroke='#111827' stroke-width='1.4'><circle cx='-6' cy='-71' r='5'/><circle cx='6' cy='-71' r='5'/><path d='M-1,-71 h2'/></g></g><rect x='194' y='422' width='520' height='50' rx='12' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><text x='206' y='444' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Saved. Every Monday I'll send you a summary of your list. I won't change</text><text x='206' y='461' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>anyone's dates or write to anyone on your behalf; that stays with you.</text><g transform='translate(160,482) scale(0.5)'><path d='M-28,0 v-26 q0,-20 28,-20 q28,0 28,20 v26 z' fill='#e5e7eb' stroke='#1f2937' stroke-width='2'/><rect x='-10' y='-30' width='20' height='12' rx='3' fill='#0d9488'/><path d='M0,-96 v-10' stroke='#1f2937' stroke-width='2'/><circle cx='0' cy='-108' r='4' fill='#0d9488'/><rect x='-20' y='-96' width='40' height='40' rx='10' fill='#f3f4f6' stroke='#1f2937' stroke-width='2'/><rect x='-14' y='-84' width='28' height='12' rx='6' fill='#111827'/><circle cx='-6' cy='-78' r='2.5' fill='#5eead4'/><circle cx='6' cy='-78' r='2.5' fill='#5eead4'/></g><rect x='130' y='490' width='700' height='68.5' rx='6' fill='#fef3c7' stroke='#f59e0b'/><text x='140' y='510.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>The assistant is an agent working for Ingrid. It reads the plan with pmd, edits only her file, and asks</text><text x='140' y='528.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>before it commits. The launch is still Ingrid's: her name is the Owner, and every promise in launch.md</text><text x='140' y='545.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>is one she agreed to, by email, with a person.</text></svg>