0)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#7c3aed'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#f3d6c1'/><path d='M14,-78 q14,6 10,26 q-6,-8 -12,-12 z' fill='#7a4a2a'/><circle cx='0' cy='-72' r='17' fill='#f3d6c1'/><path d='M-17,-74 q1,-18 17,-18 q16,0 17,18 q-12,-10 -34,0 z' fill='#7a4a2a'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/></g><text x='75' y='306.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='600' text-anchor='middle' xml:space='preserve'>Lena</text><rect x='140' y='70' width='330' height='152' rx='10' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><text x='154' y='94' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Lena's to-do list, Monday 14 June</text><text x='154' y='113' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>from every plan she works in</text><text x='154' y='132' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'></text><text x='154' y='151' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>☐  Slot booking endpoint</text><text x='154' y='170' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>in Sam's plan · due 11 July</text><text x='154' y='189' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'></text><text x='154' y='208' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Nothing else is hers yet.</text><rect x='500' y='70' width='435' height='112.0' rx='10' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><text x='514' y='94' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>She starts it</text><text x='514' y='112.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Lena proposes one change to Sam's plan:</text><text x='514' y='131.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#4338ca' font-weight='700' text-anchor='start' xml:space='preserve'>"Slot booking endpoint — started 14 June, Lena"</text><text x='514' y='149.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Sam approves it. The plan is his; his team suggests, he</text><text x='528' y='168.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>decides.</text><g transform='translate(560,300) scale(0.8)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#0f766e'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#8d5a3b'/><circle cx='0' cy='-72' r='17' fill='#8d5a3b'/><path d='M-17,-75 q2,-17 17,-17 q15,0 17,17 q-8,-8 -17,-8 q-9,0 -17,8 z' fill='#1f1a17'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/></g><text x='560' y='312.8' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='9.600000000000001' fill='#6b7280' font-weight='600' text-anchor='middle' xml:space='preserve'>Sam</text><rect x='610' y='236' width='325' height='86.0' rx='6' fill='#fef3c7' stroke='#f59e0b'/><text x='620' y='256.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Lena doesn't need the whole plan, only what is</text><text x='620' y='274.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>hers and can start today. Recording her start</text><text x='620' y='291.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>date is all it takes to move her card and the</text><text x='620' y='309.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>forecast.</text></svg>