<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 413' width='960' height='413' role='img' aria-label='Sam finds a problem and says so early'><style>@media (prefers-color-scheme:dark){[fill='#1f2937']{fill:#ececf8}[fill='#fbfaf7']{fill:#171728}[fill='#fff']{fill:#1f1f36}[fill='#6b7280']{fill:#a3a3c2}[fill='#4338ca']{fill:#a5b4fc}[fill='#16a34a']{fill:#86efac}[fill='#dc2626']{fill:#fca5a5}[fill='#d97706']{fill:#fcd34d}[fill='#fef3c7']{fill:#33290f}[fill='#eef2ff']{fill:#23234a}[fill='#f5f5f4']{fill:#222238}[fill='#f8fafc']{fill:#1b1b30}[fill='#e7e5e4']{fill:#2a2a44}[fill='#e0e7ff']{fill:#272750}[fill='#fafaf9']{fill:#1b1b30}[fill='#f0fdfa']{fill:#12302d}[fill='#dcfce7']{fill:#123020}[fill='#f0fdf4']{fill:#123020}[stroke='#1f2937']{stroke:#7c7ca3}[stroke='#d6d3cd']{stroke:#34344f}[stroke='#f1f5f9']{stroke:#2c2c46}[stroke='#f59e0b']{stroke:#a16207}[stroke='#a5b4fc']{stroke:#4f4f8a}[stroke='#16a34a']{stroke:#86efac}[stroke='#4338ca']{stroke:#a5b4fc}[stroke='#d97706']{stroke:#fcd34d}[stroke='#5eead4']{stroke:#2dd4bf}}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect x='1' y='1' width='958' height='411' rx='14' fill='#fbfaf7' stroke='#1f2937' stroke-width='2'/><circle cx='30' cy='30' r='15' fill='#4338ca'/><text x='30' y='35' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#fff' font-weight='700' text-anchor='middle' xml:space='preserve'>6</text><text x='54' y='27' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='600' text-anchor='start' xml:space='preserve'>Mon 5 July</text><text x='54' y='45' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='16' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Sam finds a problem and says so early</text><g transform='translate(70,250) scale(1.0)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#475569'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#b07a52'/><circle cx='0' cy='-72' r='17' fill='#b07a52'/><path d='M-17,-75 q2,-17 17,-17 q15,0 17,17 q-8,-8 -17,-8 q-9,0 -17,8 z' fill='#1f1a17'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/></g><text x='70' y='266.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='600' text-anchor='middle' xml:space='preserve'>Arjun</text><g><rect x='120' y='64' width='330' height='130' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='120' y='64' width='5' height='130' rx='2' fill='#475569'/><g transform='translate(134,73)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#475569' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#475569' stroke-width='1.5'/></g><text x='156' y='83' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Arjun  →  Sam</text><text x='438' y='83' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='end' xml:space='preserve'>Mon 5 July</text><text x='134' y='102' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Courier capacity feed</text><text x='134' y='122' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Bad news: the courier company is replacing</text><text x='134' y='139' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>the system we get their capacity from, at the</text><text x='134' y='156' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>end of July. We have to rebuild our side. I</text><text x='134' y='173' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>now think 9 weeks, not 3.</text></g><g transform='translate(530,250) scale(1.0)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#0f766e'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#8d5a3b'/><circle cx='0' cy='-72' r='17' fill='#8d5a3b'/><path d='M-17,-75 q2,-17 17,-17 q15,0 17,17 q-8,-8 -17,-8 q-9,0 -17,8 z' fill='#1f1a17'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/></g><text x='530' y='266.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='600' text-anchor='middle' xml:space='preserve'>Sam</text><rect x='580' y='64' width='355' height='112.0' rx='10' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><text x='594' y='88' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>⚠  Sam's plan warns him</text><text x='594' y='106.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Courier capacity feed: 3 weeks → 9 weeks</text><text x='594' y='125.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'></text><text x='594' y='143.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#dc2626' font-weight='700' text-anchor='start' xml:space='preserve'>"Slot API live" now looks like 29 August,</text><text x='594' y='162.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#dc2626' font-weight='normal' text-anchor='start' xml:space='preserve'>27 days after what he promised (2 August).</text><g><rect x='120' y='218' width='815' height='113' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='120' y='218' width='5' height='113' rx='2' fill='#0f766e'/><g transform='translate(134,227)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#0f766e' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#0f766e' stroke-width='1.5'/></g><text x='156' y='237' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Sam  →  Ingrid, Priya</text><text x='923' y='237' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='end' xml:space='preserve'>Mon 5 July</text><text x='134' y='256' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Heads-up: slot API at risk</text><text x='134' y='276' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Before it bites: the capacity feed went from 3 to 9 weeks (the courier company's change, Arjun's estimate). If nothing</text><text x='134' y='293' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>else changes, the API is live on 29 August instead of 2 August. I haven't moved my date yet; I'd rather we look at</text><text x='134' y='310' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>options first. Nothing else on our side is late; it's only the capacity feed.</text></g><line x1='450' y1='110' x2='576' y2='110' stroke='#6b7280' stroke-width='2' marker-end='url(#ah)'/><rect x='120' y='343' width='815' height='51.0' rx='6' fill='#fef3c7' stroke='#f59e0b'/><text x='130' y='363.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Sam wrote Arjun's honest estimate into his own plan, and the check told him his promise no longer holds. His promise still</text><text x='130' y='381.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>says 2 August, so nobody else's plan has moved yet. It is now his job to re-negotiate before the date passes, not after.</text></svg>