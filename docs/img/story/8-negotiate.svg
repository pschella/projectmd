text><g transform='translate(60,140) scale(0.62)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#4f46e5'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#f1d3b8'/><path d='M-20,-72 q0,-22 20,-22 q20,0 20,22 v14 h-8 v-12 h-24 v12 h-8 z' fill='#d9b26a'/><circle cx='0' cy='-72' r='17' fill='#f1d3b8'/><path d='M-17,-74 q1,-18 17,-18 q16,0 17,18 q-6,-4 -17,-9 q-9,6 -17,9 z' fill='#d9b26a'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/><g fill='none' stroke='#111827' stroke-width='1.4'><circle cx='-6' cy='-71' r='5'/><circle cx='6' cy='-71' r='5'/><path d='M-1,-71 h2'/></g></g><g><rect x='100' y='64' width='365' height='130' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='100' y='64' width='5' height='130' rx='2' fill='#4338ca'/><g transform='translate(114,73)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#4338ca' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#4338ca' stroke-width='1.5'/></g><text x='136' y='83' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Ingrid  →  Priya, Sam</text><text x='114' y='102' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Does the app need live capacity?</text><text x='114' y='122' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Priya, if the API lands on 29 August your release</text><text x='114' y='139' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>moves a month and takes the launch with it. Does</text><text x='114' y='156' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>the app need live courier capacity, or only the</text><text x='114' y='173' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>booking endpoint?</text></g><g transform='translate(60,280) scale(0.62)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#c2410c'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#c58c63'/><circle cx='0' cy='-72' r='17' fill='#c58c63'/><circle cx='0' cy='-94' r='8' fill='#2a1d17'/><path d='M-17,-73 q1,-19 17,-19 q16,0 17,19 q-17,-12 -34,0 z' fill='#2a1d17'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/></g><g><rect x='100' y='204' width='365' height='96' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='100' y='204' width='5' height='96' rx='2' fill='#c2410c'/><g transform='translate(114,213)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#c2410c' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#c2410c' stroke-width='1.5'/></g><text x='136' y='223' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Priya  →  Ingrid, Sam</text><text x='114' y='242' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Re: Does the app need live capacity?</text><text x='114' y='262' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Only booking. Capacity is applied server-side; we</text><text x='114' y='279' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>can test against a fixed table.</text></g><g transform='translate(60,386) scale(0.62)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#0f766e'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#8d5a3b'/><circle cx='0' cy='-72' r='17' fill='#8d5a3b'/><path d='M-17,-75 q2,-17 17,-17 q15,0 17,17 q-8,-8 -17,-8 q-9,0 -17,8 z' fill='#1f1a17'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/></g><g><rect x='100' y='310' width='365' height='113' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='100' y='310' width='5' height='113' rx='2' fill='#0f766e'/><g transform='translate(114,319)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#0f766e' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#0f766e' stroke-width='1.5'/></g><text x='136' y='329' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Sam  →  Ingrid, Priya</text><text x='114' y='348' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Re: Does the app need live capacity?</text><text x='114' y='368' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Then I'll split it. Booking API ready on 2 August,</text><text x='114' y='385' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>as promised. Live courier capacity on 30 August. I</text><text x='114' y='402' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>can commit to both.</text></g><g transform='translate(60,509) scale(0.62)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#4f46e5'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#f1d3b8'/><path d='M-20,-72 q0,-22 20,-22 q20,0 20,22 v14 h-8 v-12 h-24 v12 h-8 z' fill='#d9b26a'/><circle cx='0' cy='-72' r='17' fill='#f1d3b8'/><path d='M-17,-74 q1,-18 17,-18 q16,0 17,18 q-6,-4 -17,-9 q-9,6 -17,9 z' fill='#d9b26a'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/><g fill='none' stroke='#111827' stroke-width='1.4'><circle cx='-6' cy='-71' r='5'/><circle cx='6' cy='-71' r='5'/><path d='M-1,-71 h2'/></g></g><g><rect x='100' y='433' width='365' height='96' rx='8' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><rect x='100' y='433' width='5' height='96' rx='2' fill='#4338ca'/><g transform='translate(114,442)'><rect width='16' height='11' rx='1.5' fill='none' stroke='#4338ca' stroke-width='1.5'/><path d='M0,0 l8,6 l8,-6' fill='none' stroke='#4338ca' stroke-width='1.5'/></g><text x='136' y='452' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>Ingrid  →  Sam, Priya</text><text x='114' y='471' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Re: Does the app need live capacity?</text><text x='114' y='491' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Agreed. I need live capacity by 1 September for</text><text x='114' y='508' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>the go/no-go, so 30 August works. Thanks both.</text></g><text x='490' y='68' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Each writes their side, in their own plan:</text><rect x='490' y='82' width='445' height='60' rx='6' fill='#fff' stroke='#d6d3cd'/><text x='500' y='99' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='700' text-anchor='start' xml:space='preserve'>Sam's plan</text><text x='500' y='116' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#16a34a' font-weight='normal' text-anchor='start' xml:space='preserve'>new: Booking API ready — 2 August</text><text x='500' y='131' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#16a34a' font-weight='normal' text-anchor='start' xml:space='preserve'>new: Live courier capacity — 30 August</text><rect x='490' y='150' width='445' height='43' rx='6' fill='#fff' stroke='#d6d3cd'/><text x='500' y='167' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='700' text-anchor='start' xml:space='preserve'>Ingrid's plan</text><text x='500' y='184' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#16a34a' font-weight='normal' text-anchor='start' xml:space='preserve'>new: needs live courier capacity by 1 September</text><rect x='490' y='201' width='445' height='43' rx='6' fill='#fff' stroke='#d6d3cd'/><text x='500' y='218' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='700' text-anchor='start' xml:space='preserve'>Priya's plan</text><text x='500' y='235' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>no change: still needs the booking API by 2 August</text><rect x='490' y='258' width='445' height='118' rx='8' fill='#fff' stroke='#1f2937' stroke-width='1.5'/><text x='502' y='276' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' font-weight='700' text-anchor='start' xml:space='preserve'>Gantt chart, after</text><text x='502' y='300' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Booking API ready</text><path d='M748.0,290 l6,6 l-6,6 l-6,-6 z' fill='#16a34a'/><text x='757.0' y='300' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#16a34a' font-weight='600' text-anchor='start' xml:space='preserve'>2 Aug</text><text x='502' y='320' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Live courier capacity</text><path d='M805.8,310 l6,6 l-6,6 l-6,-6 z' fill='#16a34a'/><text x='814.8' y='320' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#16a34a' font-weight='600' text-anchor='start' xml:space='preserve'>30 Aug</text><text x='502' y='340' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>App release</text><path d='M805.8,330 l6,6 l-6,6 l-6,-6 z' fill='#16a34a'/><text x='814.8' y='340' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#16a34a' font-weight='600' text-anchor='start' xml:space='preserve'>30 Aug</text><text x='502' y='360' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Launch</text><path d='M841.5,350 l6,6 l-6,6 l-6,-6 z' fill='#16a34a'/><text x='850.5' y='360' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#16a34a' font-weight='600' text-anchor='start' xml:space='preserve'>15 Sep ✓</text><text x='30' y='553' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve' font-style='italic'>Nobody changed anyone else's plan. People made the decision, by email; the check only showed where the dates no longer fitted, and now that they do.</text></svg>