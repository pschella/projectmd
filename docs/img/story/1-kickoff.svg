25)'><path d='M-30,0 v-26 q0,-22 30,-22 q30,0 30,22 v26 z' fill='#4f46e5'/><path d='M-8,-47 l8,10 l8,-10' fill='none' stroke='#fbfaf7' stroke-width='2.5' stroke-linejoin='round'/><rect x='-6' y='-56' width='12' height='10' fill='#f1d3b8'/><path d='M-20,-72 q0,-22 20,-22 q20,0 20,22 v14 h-8 v-12 h-24 v12 h-8 z' fill='#d9b26a'/><circle cx='0' cy='-72' r='17' fill='#f1d3b8'/><path d='M-17,-74 q1,-18 17,-18 q16,0 17,18 q-6,-4 -17,-9 q-9,6 -17,9 z' fill='#d9b26a'/><circle cx='-6' cy='-71' r='1.8' fill='#111827'/><circle cx='6' cy='-71' r='1.8' fill='#111827'/><path d='M-5,-63 q5,3 10,0' fill='none' stroke='#111827' stroke-width='1.5' stroke-linecap='round'/><g fill='none' stroke='#111827' stroke-width='1.4'><circle cx='-6' cy='-71' r='5'/><circle cx='6' cy='-71' r='5'/><path d='M-1,-71 h2'/></g></g><text x='105' y='370.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' font-weight='600' text-anchor='middle' xml:space='preserve'>Ingrid</text><rect x='200' y='70' width='470' height='233.0' rx='10' fill='#fff' stroke='#d6d3cd' stroke-width='1.5'/><text x='214' y='94' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Ingrid's plan: scheduled deliveries</text><text x='214' y='113.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>Launch on 15 September</text><text x='214' y='133.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#6b7280' font-weight='normal' text-anchor='start' xml:space='preserve'>promised to sales and marketing</text><text x='214' y='152.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'></text><text x='214' y='172.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>What I need from others:</text><text x='214' y='191.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#4338ca' font-weight='normal' text-anchor='start' xml:space='preserve'>☐  Slot API — from Sam, by 2 August</text><text x='214' y='211.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#4338ca' font-weight='normal' text-anchor='start' xml:space='preserve'>☐  App release — from Priya, by 30 August</text><text x='214' y='230.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#4338ca' font-weight='normal' text-anchor='start' xml:space='preserve'>☐  Support ready — from Tomás, by 1 September</text><text x='214' y='250.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'></text><text x='214' y='269.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>☐  Go/no-go — once all three are in</text><text x='214' y='289.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' fill='#1f2937' font-weight='700' text-anchor='start' xml:space='preserve'>☐  15 September: scheduled deliveries live</text><rect x='700' y='80' width='235' height='138.5' rx='6' fill='#fef3c7' stroke='#f59e0b'/><text x='710' y='100.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Ingrid owns the launch date. She</text><text x='710' y='118.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>does not own the API, the app or</text><text x='710' y='135.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>support. She writes down what she</text><text x='710' y='153.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>needs from each, and from whom,</text><text x='710' y='170.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>with the date she needs it. Each</text><text x='710' y='188.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>item points to the plan of the</text><text x='710' y='205.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>person who owns it.</text><rect x='700' y='238.5' width='235' height='86.0' rx='6' fill='#eef2ff' stroke='#a5b4fc'/><text x='710' y='259.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>Nothing here is computed yet. 15</text><text x='710' y='276.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>September was agreed with sales</text><text x='710' y='294.0' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>and marketing. The three dates</text><text x='710' y='311.5' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937' font-weight='normal' text-anchor='start' xml:space='preserve'>are requests, not answers.</text></svg>