[workspace]
members = ["pmd-core", "pmd-cli", "pmd-wasm"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Used by build-wasm.sh (`cargo build --profile wasm`): small module for the browser viewer.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
