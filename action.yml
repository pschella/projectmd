name: projectmd check
description: Check projectmd plans in CI (format, links, dates), fail on findings, and summarise plan changes on pull requests.
branding:
  icon: check-circle
  color: blue

inputs:
  files:
    description: Space-separated root plan files or globs, relative to the repository root. No spaces in file names.
    required: true
  deep:
    description: Check the whole link graph (pmd check --deep).
    required: false
    default: "true"
  strict:
    description: Treat warnings as failures (pmd check --strict).
    required: false
    default: "true"
  today:
    description: Pretend today is this date (YYYY-MM-DD). Sets PMD_TODAY.
    required: false
    default: ""
  version:
    description: >-
      "source" builds pmd from this action's own checkout. Any other value is a release tag
      (for example v0.2.0) downloaded from GitHub Releases; falls back to a source build if the download fails.
    required: false
    default: "source"
  changes:
    description: On pull requests, write pmd changes for each changed plan file to the job summary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Validate inputs and expand files
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        DEEP: ${{ inputs.deep }}
        STRICT: ${{ inputs.strict }}
        CHANGES: ${{ inputs.changes }}
        TODAY: ${{ inputs.today }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        for pair in "DEEP:$DEEP" "STRICT:$STRICT" "CHANGES:$CHANGES"; do
          case "${pair#*:}" in
            true|false) ;;
            *) echo "::error::${pair%%:*} must be true or false, got '${pair#*:}'"; exit 1 ;;
          esac
        done
        if [[ -n "$TODAY" ]]; then
          if [[ ! "$TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::today must be YYYY-MM-DD, got '$TODAY'"
            exit 1
          fi
          echo "PMD_TODAY=$TODAY" >> "$GITHUB_ENV"
        fi
        roots="$RUNNER_TEMP/pmd-roots.txt"
        : > "$roots"
        # Unquoted on purpose: the input is split on spaces and each word is a glob.
        for pattern in $FILES; do
          matches=( $pattern )
          if [[ ${#matches[@]} -eq 0 ]]; then
            echo "::warning::'$pattern' matched no files"
          fi
          for f in ${matches[@]+"${matches[@]}"}; do
            printf '%s\n' "$f" >> "$roots"
          done
        done
        sort -u "$roots" -o "$roots"
        count=$(wc -l < "$roots" | tr -d ' ')
        if [[ "$count" -eq 0 ]]; then
          echo "::error::files matched no plan files"
          exit 1
        fi
        echo "Plan files: $count"
        cat "$roots"

    - name: Fetch pmd release
      id: fetch
      if: inputs.version != 'source'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        target=""
        case "$RUNNER_OS_NAME/$RUNNER_ARCH_NAME" in
          Linux/X64) target=x86_64-unknown-linux-gnu ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          macOS/X64) target=x86_64-apple-darwin ;;
          Windows/X64) target=x86_64-pc-windows-msvc ;;
        esac
        installed=false
        if [[ -z "$target" ]]; then
          echo "No release binary for $RUNNER_OS_NAME/$RUNNER_ARCH_NAME; building from source instead."
        else
          ext=tar.gz
          if [[ "$RUNNER_OS_NAME" == "Windows" ]]; then ext=zip; fi
          name="pmd-$VERSION-$target"
          url="https://github.com/pschella/projectmd/releases/download/$VERSION/$name.$ext"
          dl="$RUNNER_TEMP/pmd-dl"
          mkdir -p "$dl" "$RUNNER_TEMP/pmd-bin"
          if curl -fsSL --retry 2 -o "$dl/$name.$ext" "$url" \
            && cd "$dl" \
            && { if [[ "$ext" == zip ]]; then 7z x -y "$name.zip" >/dev/null; else tar -xzf "$name.tar.gz"; fi; }; then
            bin="pmd"
            if [[ "$ext" == zip ]]; then bin="pmd.exe"; fi
            cp "$dl/$name/$bin" "$RUNNER_TEMP/pmd-bin/$bin"
            chmod +x "$RUNNER_TEMP/pmd-bin/$bin" || true
            echo "$RUNNER_TEMP/pmd-bin" >> "$GITHUB_PATH"
            installed=true
            echo "Installed $name from $url"
          else
            echo "::warning::could not download $url; building from source instead"
          fi
        fi
        echo "installed=$installed" >> "$GITHUB_OUTPUT"

    - name: Set up Rust
      if: steps.fetch.outputs.installed != 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Restore pmd build cache
      if: steps.fetch.outputs.installed != 'true'
      uses: actions/cache@v4
      with:
        # Keyed on the action ref. Cargo rebuilds changed sources from the cache, so a moving ref stays correct.
        path: ${{ github.action_path }}/parser/target
        key: pmd-build-${{ github.action_ref }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build pmd from source
      if: steps.fetch.outputs.installed != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/parser
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        cargo build --release -p pmd-cli
        echo "$ACTION_PATH/parser/target/release" >> "$GITHUB_PATH"

    - name: Show pmd version
      shell: bash
      run: pmd --version

    - name: Format check
      id: fmt
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        bad=0
        while IFS= read -r f; do
          if ! pmd fmt --check "$f"; then
            bad=$((bad + 1))
          fi
        done < "$RUNNER_TEMP/pmd-roots.txt"
        echo "$bad" > "$RUNNER_TEMP/pmd-fmt-bad.txt"
        [[ "$bad" -eq 0 ]]

    - name: Check plans
      id: check
      continue-on-error: true
      shell: bash
      env:
        DEEP: ${{ inputs.deep }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        flags=""
        if [[ "$DEEP" == "true" ]]; then flags="$flags --deep"; fi
        if [[ "$STRICT" == "true" ]]; then flags="$flags --strict"; fi
        findings=0
        errors=0
        out="$RUNNER_TEMP/pmd-check-one.txt"
        log="$RUNNER_TEMP/pmd-check.log"
        : > "$log"
        while IFS= read -r f; do
          rc=0
          # $flags holds only the fixed words above, so unquoted expansion is safe.
          pmd check $flags "$f" > "$out" 2>&1 || rc=$?
          cat "$out" >> "$log"
          # Diagnostic lines look like "path:line: E E-CODE message"; the "fix:" lines do not match.
          n=$(grep -cE ' [EW] [EW]-[A-Z0-9-]+ ' "$out" || true)
          findings=$((findings + n))
          if [[ "$rc" -ne 0 && "$n" -eq 0 ]]; then
            errors=$((errors + 1))
          fi
          if [[ "$rc" -eq 2 ]]; then
            errors=$((errors + 1))
          fi
        done < "$RUNNER_TEMP/pmd-roots.txt"
        cat "$log"
        printf 'findings=%s\nerrors=%s\n' "$findings" "$errors" > "$RUNNER_TEMP/pmd-check.txt"
        if [[ "$findings" -gt 0 || "$errors" -gt 0 ]]; then
          exit 1
        fi

    - name: Plan changes
      if: inputs.changes == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/pmd-changes.txt"
        : > "$out"
        base_file="$RUNNER_TEMP/pmd-base-plan.md"
        one="$RUNNER_TEMP/pmd-changes-one.txt"
        if ! git diff --name-status --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pmd-diff.txt" 2>/dev/null; then
          echo "::warning::could not diff against the base commit; use fetch-depth: 0 on actions/checkout" >&2
          echo "(could not compare with the base commit: fetch the full history with fetch-depth: 0)" >> "$out"
        else
          while IFS=$'\t' read -r status path; do
            # Only changed markdown files that exist in both versions (skip added and deleted files).
            [[ "$status" == "M" ]] || continue
            [[ "$path" == *.md ]] || continue
            if ! git show "$BASE_SHA:$path" > "$base_file" 2>/dev/null; then
              continue
            fi
            # Markdown that is not a plan reports "no changes" (or fails); only real events go to the summary.
            if ! pmd changes "$base_file" "$path" > "$one" 2>&1; then
              echo "(could not compare $path)" >> "$out"
              continue
            fi
            if [[ "$(cat "$one")" != "no changes" ]]; then
              echo "== $path ==" >> "$out"
              cat "$one" >> "$out"
              echo >> "$out"
            fi
          done < "$RUNNER_TEMP/pmd-diff.txt"
        fi
        {
          echo "### Plan changes"
          echo
          if [[ -s "$out" ]]; then
            echo '```text'
            cat "$out"
            echo '```'
          else
            echo "No changed plan files."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        files=$(wc -l < "$RUNNER_TEMP/pmd-roots.txt" 2>/dev/null | tr -d ' ' || true)
        fmt_bad=$(cat "$RUNNER_TEMP/pmd-fmt-bad.txt" 2>/dev/null || echo "not run")
        findings=$(sed -n 's/^findings=//p' "$RUNNER_TEMP/pmd-check.txt" 2>/dev/null || true)
        errors=$(sed -n 's/^errors=//p' "$RUNNER_TEMP/pmd-check.txt" 2>/dev/null || true)
        {
          echo
          echo "### projectmd check"
          echo
          echo "- Files checked: ${files:-0}"
          echo "- Files not in canonical form: $fmt_bad"
          echo "- Findings: ${findings:-not run}"
          echo "- Files with check errors: ${errors:-not run}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail on findings
      if: always()
      shell: bash
      env:
        FMT_OUTCOME: ${{ steps.fmt.outcome }}
        CHECK_OUTCOME: ${{ steps.check.outcome }}
      run: |
        set -euo pipefail
        if [[ "$FMT_OUTCOME" == "failure" || "$CHECK_OUTCOME" == "failure" ]]; then
          echo "::error::projectmd check found problems (see the job summary)"
          exit 1
        fi
